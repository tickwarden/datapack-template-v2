name: Build & Publish Datapack

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: my_datapack   # Directory containing pubspec.yaml
  DART_ENTRY: main.dart      # Entry point relative to PROJECT_DIR
  PACK_NAME: Template-Pack

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Build datapack (production zip)
        run: |
          dart run "$DART_ENTRY" --prod
          # Alternative: dart run "$DART_ENTRY" --export-zip

      - name: Locate and rename zip
        id: pack
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -n1)
          if [ -z "$ZIP" ]; then
            echo "::error::Datapack zip not found in ${PROJECT_DIR}"
            ls -la
            exit 1
          fi
          OUT="${PACK_NAME}-${{ github.sha }}.zip"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            OUT="${PACK_NAME}-${GITHUB_REF_NAME}.zip"
          fi
          cp "$ZIP" "$OUT"
          # Absolute path so the upload step (no working-directory) can find it
          echo "zip=${PROJECT_DIR}/${OUT}" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP → $OUT"
          ls -lh "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: datapack
          path: ${{ steps.pack.outputs.zip }}
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: datapack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
